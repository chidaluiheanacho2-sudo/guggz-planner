<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guggz's Planner</title>
<meta name="theme-color" content="#070B24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guggz's Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Unbounded:wght@600;800&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first training app on a running-track identity. Workout types use weight-plate colours:
   upper = blue plate, lower = red plate, sprint = yellow plate, done = green plate. One bold element: the lane hero on Train. */
:root{
  /* Night race: floodlit ultramarine stadium, frosted glass, chrome race numbers, neon plate colours */
  --bg:#070B24; --bg2:#0D1440; --surface:rgba(22,30,78,.62); --solid:#111A48; --sunk:rgba(255,255,255,.05);
  --fg:#EEF1FF; --muted:#8F99C9; --line:rgba(150,170,255,.16);
  --accent:#6E8BFF; --accent-ink:#06092A; --accent-soft:rgba(110,139,255,.16);
  --upper:#4F7DFF; --lower:#FF4D61; --sprint:#FFD23F; --sprint-ink:#1A1400;
  --good:#2FE3B0; --good-soft:rgba(47,227,176,.14); --warn:#FFB84D; --warn-soft:rgba(255,184,77,.14); --bad:#FF6B7D; --bad-soft:rgba(255,107,125,.14);
  --uni:#B79BFF; --uni-soft:rgba(183,155,255,.16);
  --chrome:linear-gradient(180deg,#FFFFFF 0%,#DDE3FF 38%,#8E9AD6 52%,#F4F6FF 70%,#C9D1FF 100%);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-wide:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Archivo",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-mono:"Archivo",-apple-system,system-ui,sans-serif;
  --r:16px; --nav:66px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
h1{font:900 1.75rem/1 var(--f-display);letter-spacing:.01em;margin:0}
h1 span{color:var(--accent)}
.week{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.pips{display:flex;gap:4px}.pip{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--line)}
.pip.on{background:var(--type,var(--accent));border-color:var(--type,var(--accent))}
main{padding-block:16px calc(var(--nav) + 96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{border:0;background:none;color:var(--muted);font:600 .7rem var(--f-body);padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:var(--nav)}
nav.bottom button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--accent)}
h2{font:800 1.9rem/1 var(--f-display);letter-spacing:.005em;margin:0;text-wrap:balance}
h3{font:600 1.02rem/1.3 var(--f-body);margin:0}
.lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.mono{font-variant-numeric:tabular-nums;font-weight:600}
.small{font-size:.84rem}
p{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 12px;font:600 .88rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .nx{font-size:.74rem;font-weight:500;margin-left:6px;opacity:.8}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:600 .9rem var(--f-body);padding:8px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.grow{flex:1 1 140px}
input,select,textarea{font:500 16px var(--f-body);color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:64px;resize:vertical}
.focus{display:inline-block;font:600 .78rem var(--f-body);padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:8px;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rx{font:500 .82rem var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted)}
.cue{font-size:.86rem;color:var(--muted)}
.iso{display:flex;gap:10px;align-items:baseline;font-size:.88rem;border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.iso .lbl{color:var(--accent);flex:none}
.target{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-radius:8px;padding:8px 10px;font-size:.88rem;background:var(--sunk)}
.target.up{background:var(--good-soft)}.target.up b{color:var(--good)}
.target.reset{background:var(--warn-soft)}.target.reset b{color:var(--warn)}
.target .msg{flex:1 1 220px;min-width:0}
.plates{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.plate{display:inline-flex;align-items:center;justify-content:center;width:22px;border-radius:3px;font:500 .6rem var(--f-mono);color:#fff;border:1px solid rgba(0,0,0,.25)}
.p25{background:#C8202E;height:34px}.p20{background:#1F4FB5;height:32px}.p15{background:#E2B51C;height:29px;color:#1b1b1b}.p10{background:#1E8A4C;height:25px}.p5{background:#F2F2F2;height:20px;color:#1b1b1b}.p2{background:#C8202E;height:16px;width:16px}.p1{background:#A9B0B8;height:13px;width:14px;color:#1b1b1b}
.sets{width:100%;border-collapse:collapse}
.sets th{font:600 .78rem var(--f-body);color:var(--muted);text-align:left;padding:0 6px 4px}
.sets td{padding:4px 6px;vertical-align:middle}
.sets td:first-child{font:800 1.15rem var(--f-display);color:var(--muted);width:2.2em}
.sets input{width:100%;max-width:7.5em;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.sets select{width:100%;max-width:15em;font-size:15px}
.sets tr.done input,.sets tr.done select{border-color:var(--good);background:var(--good-soft)}
.tick{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:1.1rem;cursor:pointer;flex:none}
tr.done .tick,.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 14px;font:600 .9rem var(--f-body);cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:12px 18px;font-size:1rem}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.82rem}
.btn:disabled{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:7;padding:8px max(16px,env(safe-area-inset-left,0px));background:var(--fg);color:var(--bg)}
.timer .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.timer .t{font:900 2.1rem/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:3em}
.timer .what{flex:1;min-width:0;font-size:.8rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{border:1.5px solid currentColor;background:none;color:inherit;border-radius:8px;padding:6px 10px;font:600 .82rem var(--f-body);cursor:pointer}
.timer.done{background:var(--good);color:#fff}
.tablewrap{overflow-x:auto}
table.plan{width:100%;border-collapse:collapse;font-size:.9rem}
table.plan th,table.plan td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.plan th{font:600 .8rem var(--f-body);color:var(--muted)}
table.plan td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px}
.stat .v{font:800 1.9rem/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;display:block}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wlist li{display:flex;gap:10px;align-items:flex-start}
.wlist li>div{min-width:0}
.wname{font-weight:600}
.wlist li.done .wname{color:var(--good)}
.card.accent{border-color:var(--accent);box-shadow:inset 0 4px 0 var(--accent-soft)}
.sk{display:inline-block;font:700 .72rem var(--f-body);padding:2px 7px;border-radius:4px;background:var(--fg);color:var(--surface);margin-right:8px;vertical-align:2px}
.sk.sprint{background:var(--sprint);color:var(--sprint-ink)}.sk.sled{background:var(--lower);color:#fff}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--fg);border-radius:var(--r);padding:12px 14px}
.banner b{color:var(--accent)}
/* lane hero */
.t-upper{--type:var(--upper);--type-ink:#fff}.t-lower{--type:var(--lower);--type-ink:#fff}.t-sprint{--type:var(--sprint);--type-ink:var(--sprint-ink)}.t-other{--type:var(--accent);--type-ink:var(--accent-ink)}
.lane{position:relative;background:var(--type);color:var(--type-ink);border-radius:18px;overflow:hidden;padding:18px 18px 16px 0;display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:start;
  border-top:4px solid rgba(255,255,255,.85);border-bottom:4px solid rgba(255,255,255,.85)}
.lane::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.07) 46px 48px);pointer-events:none}
.lane-no{font:900 6.2rem/.8 var(--f-display);padding-left:16px;transform:scaleY(1.12);transform-origin:top;opacity:.95;font-variant-numeric:tabular-nums}
.lane-body{display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.lane-kicker{font-size:.86rem;font-weight:600;opacity:.88}
.lane-title{font:900 2.6rem/.95 var(--f-display);margin:2px 0 0;letter-spacing:.005em;overflow-wrap:anywhere}
.lane-focus{font-size:.95rem;font-weight:500;opacity:.9}
.lane-track{grid-column:1/-1;position:relative;height:28px;margin:14px 0 0 16px;border-top:2px solid rgba(255,255,255,.6);border-bottom:2px solid rgba(255,255,255,.6);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 2px,transparent 2px 10%)}
.lane-track .fin{position:absolute;right:0;top:0;bottom:0;width:12px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/6px 6px}
.lane-track .run{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3);transition:left .6s cubic-bezier(.2,.8,.2,1)}
.t-sprint .lane-track .run{background:var(--sprint-ink);box-shadow:0 0 0 4px rgba(0,0,0,.15)}
.lane-meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0 0 16px;font-size:.88rem;font-weight:600}
.lane-meta button{border:2px solid currentColor;background:none;color:inherit;border-radius:8px;padding:4px 10px;font:600 .82rem var(--f-body);cursor:pointer}
@media (prefers-reduced-motion:reduce){.lane-track .run{transition:none}}
@media (max-width:380px){.lane-no{font-size:4.6rem}.lane-title{font-size:2.1rem}}
.chip.t-upper[aria-pressed="true"],.chip.t-lower[aria-pressed="true"],.chip.t-sprint[aria-pressed="true"],.chip.t-other[aria-pressed="true"]{background:var(--type);border-color:var(--type);color:var(--type-ink)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--type);margin-right:7px;vertical-align:0}
.chip[aria-pressed="true"] .dot{background:currentColor}
.day.planned{box-shadow:inset 5px 0 0 var(--type)}
/* graphics */
.lane-track .run{width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:0;background:none;box-shadow:none;color:#fff}
.lane-track .run svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.t-sprint .lane-track .run{color:var(--sprint-ink);background:none;box-shadow:none}
.lane-track .run.moving svg{animation:stride .35s ease-in-out 2}
@keyframes stride{50%{transform:translateY(-4px) rotate(-6deg)}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.finish{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,10,30,.55);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.finish-card{position:relative;width:100%;max-width:520px;background:var(--surface);color:var(--fg);border-radius:20px;overflow:hidden;padding:30px 20px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.chequer{position:absolute;left:0;right:0;top:0;height:14px;background:repeating-conic-gradient(var(--fg) 0 25%,var(--surface) 0 50%) 0 0/14px 14px}
.finish-card::after{content:"";position:absolute;left:0;right:0;top:14px;height:6px;background:var(--type)}
.finish-kicker{font-size:.9rem;color:var(--muted);font-weight:600;margin-top:4px}
.finish-title{font:900 2.5rem/.95 var(--f-display);margin:0}
.finish-stats{display:flex;gap:18px;flex-wrap:wrap}
.finish-stats div{display:flex;flex-direction:column}
.finish-stats b{font:900 2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.finish-stats span{font-size:.82rem;color:var(--muted)}
.prs{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.prs-head{font-weight:700}
.pr{display:flex;gap:10px;align-items:center;font-size:.9rem}
.medal{width:28px;height:35px;flex:none}
.finish-note,.finish-next{font-size:.92rem;color:var(--muted)}
.finish-next b{color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.finish-card{animation:rise .45s cubic-bezier(.2,.8,.2,1)}.chequer{animation:flagwave 1.2s linear 2}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes flagwave{to{background-position:28px 0}}
.lap{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.lap svg{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.lap .track{fill:none;stroke:var(--sunk);stroke-width:28}
.lap .seg{fill:none;stroke-width:28}
.lap .laneline{fill:none;stroke:var(--surface);stroke-opacity:.75;stroke-width:1.5}
.lap .todaymark{fill:none;stroke:var(--fg);stroke-width:14;stroke-linecap:round}
.lap .daylbl{font:700 13px var(--f-body);fill:var(--muted)}
.lap .daylbl.now{fill:var(--fg)}
.lap .lapnum{font:900 30px var(--f-display);fill:var(--fg)}
.lap .lapsub{font:500 12px var(--f-body);fill:var(--muted)}
/* meal photos */
.snap{border-color:var(--accent)}
.snapgrid{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.snapimg{width:120px;height:120px;object-fit:cover;border-radius:12px;background:var(--sunk)}
.snapside{display:flex;flex-direction:column;gap:8px;min-width:0}
.snaphdr,.snaprow{display:grid;grid-template-columns:1fr 4.6em 4.6em 32px;gap:6px;align-items:center}
.snaprow input{min-width:0;font-size:16px;padding:7px 8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;vertical-align:-2px;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.meal{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.mealthumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.mealthumb.none{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px)}
.mealbody{min-width:0}
.mealhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.meal .list .it{padding:4px 0;border:0}
/* plan */
.day{display:flex;flex-direction:column;gap:8px}
.dayrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dayrow .d{font:800 1.4rem/1 var(--f-display)}
.day.today{border-color:var(--accent);border-width:2px}
.blocks{display:flex;flex-direction:column;gap:5px}
.blk{display:flex;gap:8px;align-items:baseline;border-radius:7px;padding:6px 9px;font-size:.88rem;border-left:4px solid}
.blk .tm{font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.blk .tt{min-width:0;overflow-wrap:anywhere}
.blk.uni{background:var(--uni-soft);border-color:var(--uni)}
.blk.work{background:var(--warn-soft);border-color:var(--warn)}
.blk.train{background:var(--accent-soft);border-color:var(--type,var(--accent));font-weight:600}
.blk.done{background:var(--good-soft);border-color:var(--good);font-weight:600}
.blk.rest{background:var(--sunk);border-color:var(--line);color:var(--muted)}
.blk .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:0 4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--good)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos figure{margin:0;display:flex;flex-direction:column;gap:3px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--sunk)}
.photos figcaption{font-size:.72rem;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it>div{min-width:0}

/* ===== Night race layer ===== */
body{background:radial-gradient(120% 70% at 50% -10%,#1B2A7A 0%,transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg) 40%);background-color:var(--bg);background-attachment:fixed}
.trackbg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;perspective:340px}
.trackbg .plane{position:absolute;left:-70%;right:-70%;top:52%;height:160%;transform:rotateX(72deg);transform-origin:50% 0;
  background:
   repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 3px),rgba(140,165,255,.34) calc(12.5% - 3px) 12.5%),
   repeating-linear-gradient(180deg,transparent 0 150px,rgba(255,77,97,.16) 150px 156px);
  background-position:0 var(--scroll,0px);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.9) 22%,#000 60%,transparent 95%);mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.9) 22%,#000 60%,transparent 95%)}
.trackbg::after{content:"";position:absolute;left:0;right:0;top:44%;height:16vh;background:linear-gradient(180deg,var(--bg) 0%,transparent 100%);opacity:.0}
.trackbg .glow{position:absolute;left:50%;top:-20vh;width:120vw;height:60vh;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(110,139,255,.35),transparent);filter:blur(10px)}
header.top{background:rgba(7,11,36,.62);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
header.top::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:calc(var(--sp,0) * 100%);background:linear-gradient(90deg,var(--upper),var(--lower),var(--sprint));box-shadow:0 0 12px rgba(110,139,255,.8)}
h1{font:800 1.35rem/1 var(--f-wide);letter-spacing:-.01em;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{color:var(--lower);-webkit-text-fill-color:var(--lower)}
h2{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.card,.lap,.empty{background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.card.accent{border-color:rgba(110,139,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(110,139,255,.15),0 10px 40px -18px rgba(110,139,255,.7)}
input,select,textarea{background:var(--solid);border-color:var(--line);color:var(--fg)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,139,255,.25);outline:none}
.btn{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--fg)}
.btn.primary{background:linear-gradient(135deg,#7C95FF,#4F6BFF);border:0;color:#fff;box-shadow:0 8px 24px -10px rgba(79,107,255,.9),inset 0 1px 0 rgba(255,255,255,.3)}

.chip{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--fg)}
.chip.t-upper[aria-pressed="true"],.chip.t-lower[aria-pressed="true"],.chip.t-sprint[aria-pressed="true"],.chip.t-other[aria-pressed="true"]{box-shadow:0 0 22px -4px var(--type)}
.seg{background:rgba(255,255,255,.05)}.seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--fg);box-shadow:none}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line)}

tr.done .tick,.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#04241A;box-shadow:0 0 16px -2px var(--good)}
.tick.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.sets tr.done input,.sets tr.done select{border-color:rgba(47,227,176,.6);background:rgba(47,227,176,.08)}
.sk{background:rgba(255,255,255,.12);color:var(--fg)}
.exicon{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--type,var(--accent));margin-right:10px}

/* lane hero: photo-finish board */
.lane{background:linear-gradient(135deg,color-mix(in srgb,var(--type) 55%,#070B24) 0%,#0B1236 70%);border:1px solid color-mix(in srgb,var(--type) 60%,transparent);border-top-width:1px;border-bottom-width:1px;box-shadow:0 20px 60px -30px var(--type),inset 0 1px 0 rgba(255,255,255,.12);color:#fff}

.lane::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.10) 45%,transparent 60%);transform:translateX(-100%)}
.lane-no{font:900 6.6rem/.8 var(--f-display);color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--type) 70%,#fff);opacity:.9}

.lane-track{border-color:rgba(255,255,255,.35)}
.lane-meta button{color:#fff}
/* nav: floating glass dock */
nav.bottom{background:transparent;border:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
nav.bottom .in{position:relative;background:rgba(12,18,56,.72);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 40px -16px rgba(0,0,0,.8)}
nav.bottom button{position:relative;z-index:1;min-height:58px}
nav.bottom button[aria-current="page"]{color:#fff}
.navpill{position:absolute;top:6px;bottom:6px;left:0;width:20%;border-radius:16px;background:linear-gradient(135deg,rgba(124,149,255,.35),rgba(79,107,255,.18));box-shadow:inset 0 0 0 1px rgba(124,149,255,.45),0 0 24px -6px rgba(110,139,255,.9);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.timer{bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));border-radius:18px;background:rgba(238,241,255,.95);color:#070B24;box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
.timer.done{background:var(--good);color:#04241A}
.toast{bottom:calc(var(--nav) + 30px + env(safe-area-inset-bottom,0px));background:rgba(238,241,255,.96);color:#070B24}
main{padding-block:16px calc(var(--nav) + 120px + env(safe-area-inset-bottom,0px))}
/* scroll reveal */
.rv{opacity:0;transform:translateY(26px) scale(.98);filter:blur(6px)}
.rv.in{opacity:1;transform:none;filter:none;transition:opacity .6s ease,transform .7s cubic-bezier(.16,1,.3,1),filter .6s ease;transition-delay:var(--d,0ms)}
@media (prefers-reduced-motion:no-preference){.lane::after{animation:sheen 4.5s ease-in-out 1.2s infinite}@keyframes sheen{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;filter:none}.trackbg .plane{background-position:0 0}.navpill{transition:none}}
